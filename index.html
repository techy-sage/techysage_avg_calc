
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>TechySage Average Calculator</title>
<meta name="description" content="A simple offline-ready average calculator for primary school pupils.">

<!-- PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<!-- iOS home-screen support -->
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AvgCalc">

<!-- Android / general -->
<link rel="icon" href="icons/icon-192.png">

<style>
  :root{
    --blue:#2563eb;
    --blue-dark:#1d4ed8;
    --green:#16a34a;
    --red:#dc2626;
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:linear-gradient(160deg,#dbeafe,var(--bg) 55%);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
  }
  #app{
    width:100%;
    max-width:420px;
  }
  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:28px 24px;
    box-shadow:0 10px 30px rgba(30,41,59,.12);
  }
  h1{
    font-size:1.4rem;
    margin:0 0 4px;
    text-align:center;
    color:var(--blue-dark);
  }
  .subtitle{
    text-align:center;
    color:var(--muted);
    font-size:.9rem;
    margin:0 0 22px;
  }
  .screen{display:none;}
  .screen.active{display:block;}
  label{
    display:block;
    font-weight:600;
    margin-bottom:8px;
    font-size:.95rem;
  }
  input[type=number]{
    width:100%;
    padding:14px 16px;
    font-size:1.1rem;
    border:2px solid #cbd5e1;
    border-radius:12px;
    outline:none;
    transition:border-color .15s;
  }
  input[type=number]:focus{border-color:var(--blue);}
  .btn{
    display:block;
    width:100%;
    padding:14px 16px;
    font-size:1.05rem;
    font-weight:700;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin-top:16px;
    color:#fff;
    background:var(--blue);
    transition:transform .08s, background .15s;
  }
  .btn:active{transform:scale(.98);}
  .btn:hover{background:var(--blue-dark);}
  .btn.secondary{
    background:#e2e8f0;
    color:var(--text);
  }
  .btn.secondary:hover{background:#cbd5e1;}
  .btn.danger{background:var(--red);}
  .error-msg{
    color:var(--red);
    font-size:.88rem;
    margin-top:8px;
    min-height:1.2em;
  }
  .progress{
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
    margin-bottom:14px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .score-list{
    list-style:none;
    padding:0;
    margin:0 0 18px;
    max-height:160px;
    overflow-y:auto;
  }
  .score-list li{
    display:flex;
    justify-content:space-between;
    padding:8px 4px;
    border-bottom:1px solid #eef2f7;
    font-size:.95rem;
  }
  .result-box{
    background:#eff6ff;
    border-radius:14px;
    padding:18px;
    text-align:center;
    margin:6px 0 4px;
  }
  .result-box .avg{
    font-size:2.4rem;
    font-weight:800;
    color:var(--blue-dark);
    line-height:1.1;
  }
  .result-box .label{
    color:var(--muted);
    font-size:.85rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .row{display:flex;gap:10px;}
  .row .btn{margin-top:0;}
  .history-item{
    background:#f8fafc;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:10px;
    font-size:.88rem;
  }
  .history-item .hdate{
    color:var(--muted);
    font-size:.78rem;
    margin-bottom:4px;
  }
  .empty-msg{
    text-align:center;
    color:var(--muted);
    padding:20px 0;
    font-size:.9rem;
  }
  .offline-pill{
    display:none;
    text-align:center;
    font-size:.75rem;
    font-weight:700;
    color:#92400e;
    background:#fef3c7;
    border-radius:20px;
    padding:6px 12px;
    margin:0 auto 14px;
    width:fit-content;
  }
  .offline-pill.show{display:block;}
</style>
</head>
<body>
<div id="app">
  <div class="offline-pill" id="offlinePill">You're offline — the app still works</div>
  <div class="card">
    <h1>TechySage Average Calculator</h1>
    <p class="subtitle">Enter your subject scores to find your average</p>

    <!-- SETUP SCREEN -->
    <section class="screen active" id="screen-setup">
      <label for="numSubjects">How many subjects?</label>
      <input type="number" id="numSubjects" min="1" step="1" placeholder="e.g. 5" inputmode="numeric">
      <div class="error-msg" id="setupError"></div>
      <button class="btn" id="btnStart">Start</button>
      <button class="btn secondary" id="btnShowHistory">View Saved Results</button>
    </section>

    <!-- SCORE ENTRY SCREEN -->
    <section class="screen" id="screen-entry">
      <div class="progress" id="entryProgress"></div>
      <label id="entryLabel" for="scoreInput">Score</label>
      <input type="number" id="scoreInput" min="0" max="100" step="1" placeholder="0 - 100" inputmode="numeric">
      <div class="error-msg" id="entryError"></div>
      <button class="btn" id="btnNext">Next</button>
      <button class="btn secondary" id="btnCancelEntry">Cancel</button>
    </section>

    <!-- RESULTS SCREEN -->
    <section class="screen" id="screen-results">
      <ul class="score-list" id="scoreList"></ul>
      <div class="result-box">
        <div class="label">Average</div>
        <div class="avg" id="avgValue">0.00</div>
        <div class="label" id="totalValue">Total: 0</div>
      </div>
      <div class="row">
        <button class="btn secondary" id="btnAgain">New Calculation</button>
        <button class="btn" id="btnSave">Save Result</button>
      </div>
    </section>

    <!-- HISTORY SCREEN -->
    <section class="screen" id="screen-history">
      <div id="historyList"></div>
      <button class="btn secondary" id="btnClearHistory">Clear All Saved Results</button>
      <button class="btn" id="btnBackFromHistory">Back</button>
    </section>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
